<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An independent portfolio application exploring fictional healthcare benefits and care coordination."
    />
    <script>
      try {
        const preference = localStorage.getItem('bde-theme') || 'system';
        const dark =
          preference === 'dark' ||
          (preference === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {
        // Start in the light theme when browser storage is unavailable.
      }
    </script>
    <title>Benefits Decision Explorer</title>
  </head>
  <body>
    <div id="root">
      <p role="status">Starting Benefits Decision Explorer…</p>
    </div>
    <noscript
      >This demonstration requires JavaScript. All records and policies are
      fictional.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
